[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regime-backtest"
version = "0.1.0"
description = "Purged/embargoed walk-forward splits, regime-stratified Rank IC/ICIR, turnover costs and multiple-testing deflation for statistical validation hygiene."
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.setuptools.packages.find]
include = ["regime_backtest*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "film-surface-rules"
version = "0.1.0"
description = "Declarative film rule-noun evaluator, forbidden-stamp scanner, frosted-caption cognitive-load scorer, source-mirror link rewriter and llms.txt MCP parity checker."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[tool.setuptools.packages.find]
include = ["film_surface_rules*"]

[tool.setuptools.package-data]
film_surface_rules = ["*.json"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "velocity-signal-radar"
version = "0.1.0"
description = "Sanctioned multi-source artifact velocity normalization, 64-bit shingle SimHash deduplication, breakout utility vs hype scoring, curator-lens matching and bounded follow-up proposal generation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.setuptools.packages.find]
include = ["velocity_signal_radar*"]

[tool.setuptools.package-data]
velocity_signal_radar = ["config/*.json"]

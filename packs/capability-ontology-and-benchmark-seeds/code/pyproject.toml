[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capability-ontology-seeds"
version = "0.1.0"
description = "Polyhierarchical capability ontology graph, typed tool/MCP/feed intelligence cards, bounded multi-generation seed digestion and Pareto benchmark ranker"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.setuptools.packages.find]
include = ["capability_ontology_seeds*"]

[tool.setuptools.package-data]
capability_ontology_seeds = ["config/*.json"]

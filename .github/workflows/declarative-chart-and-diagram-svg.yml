# Checks for the declarative-chart-and-diagram-svg pack's code, run only when that pack or this workflow changes.
# Standard library only: nothing is installed.
name: declarative-chart-and-diagram-svg

on:
  push:
    branches: [main]
    paths:
      - "packs/declarative-chart-and-diagram-svg/**"
      - ".github/workflows/declarative-chart-and-diagram-svg.yml"
  pull_request:
    paths:
      - "packs/declarative-chart-and-diagram-svg/**"
      - ".github/workflows/declarative-chart-and-diagram-svg.yml"

permissions:
  contents: read

jobs:
  code:
    # Compile with warnings as errors and run all diagram_svg unit tests.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: packs/declarative-chart-and-diagram-svg/code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile and run every test
        run: make check PYTHON=python

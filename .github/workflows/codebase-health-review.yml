# Checks for the codebase health review pack's code, run only when that pack or this workflow changes.
# Standard library only: nothing is installed. The blame tests need git, so a missing git fails instead of skipping.
name: codebase-health-review

on:
  push:
    branches: [main]
    paths:
      - "packs/codebase-health-review/**"
      - ".github/workflows/codebase-health-review.yml"
  pull_request:
    paths:
      - "packs/codebase-health-review/**"
      - ".github/workflows/codebase-health-review.yml"

permissions:
  contents: read

jobs:
  code:
    # Compile with warnings as errors, then every test: comment detection, ages from git blame in throwaway
    # repositories with fixed author dates, every handler class, and the worked examples' recomputation.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: packs/codebase-health-review/code
    env:
      HEALTH_CHECKS_REQUIRE_GIT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile and run every test
        run: make check PYTHON=python

# Checks for the portable-agent-persona-compiler pack's code, run only when that pack or this workflow changes.
# Standard library only: nothing is installed.
name: portable-agent-persona-compiler

on:
  push:
    branches: [main]
    paths:
      - "packs/portable-agent-persona-compiler/**"
      - ".github/workflows/portable-agent-persona-compiler.yml"
  pull_request:
    paths:
      - "packs/portable-agent-persona-compiler/**"
      - ".github/workflows/portable-agent-persona-compiler.yml"

permissions:
  contents: read

jobs:
  code:
    # Compile with warnings as errors and run all persona_compiler unit tests.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: packs/portable-agent-persona-compiler/code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile and run every test
        run: make check PYTHON=python

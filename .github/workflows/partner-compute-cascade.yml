# Checks for the Partner compute cascade pack's code. Standard library only: nothing is installed.
name: partner-compute-cascade

on:
  push:
    branches: [main]
    paths:
      - "packs/partner-compute-cascade/**"
      - ".github/workflows/partner-compute-cascade.yml"
  pull_request:
    paths:
      - "packs/partner-compute-cascade/**"
      - ".github/workflows/partner-compute-cascade.yml"

permissions:
  contents: read

jobs:
  code:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: packs/partner-compute-cascade/code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile and run every test
        run: make check PYTHON=python

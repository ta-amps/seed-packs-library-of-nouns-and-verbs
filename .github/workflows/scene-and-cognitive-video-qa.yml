# Checks for the scene and cognitive video QA pack's code. Standard library only: nothing is installed.
name: scene-and-cognitive-video-qa

on:
  push:
    branches: [main]
    paths:
      - "packs/scene-and-cognitive-video-qa/**"
      - ".github/workflows/scene-and-cognitive-video-qa.yml"
  pull_request:
    paths:
      - "packs/scene-and-cognitive-video-qa/**"
      - ".github/workflows/scene-and-cognitive-video-qa.yml"

permissions:
  contents: read

jobs:
  code:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: packs/scene-and-cognitive-video-qa/code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile and run every test
        run: make check PYTHON=python

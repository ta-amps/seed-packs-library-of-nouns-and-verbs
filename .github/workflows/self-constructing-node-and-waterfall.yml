name: self-constructing-node-and-waterfall

on:
  push:
    paths:
      - "packs/self-constructing-node-and-waterfall/**"
      - ".github/workflows/self-constructing-node-and-waterfall.yml"
  pull_request:
    paths:
      - "packs/self-constructing-node-and-waterfall/**"
      - ".github/workflows/self-constructing-node-and-waterfall.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run self-constructing-node-and-waterfall unit tests
        working-directory: packs/self-constructing-node-and-waterfall/code
        run: |
          make check
          python3 -c "import constructible_node"

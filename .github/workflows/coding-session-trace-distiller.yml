# Checks for the coding-session-trace-distiller pack's code, run only when that pack or this workflow changes.
# Standard library only: nothing is installed.
name: coding-session-trace-distiller

on:
  push:
    branches: [main]
    paths:
      - "packs/coding-session-trace-distiller/**"
      - ".github/workflows/coding-session-trace-distiller.yml"
  pull_request:
    paths:
      - "packs/coding-session-trace-distiller/**"
      - ".github/workflows/coding-session-trace-distiller.yml"

permissions:
  contents: read

jobs:
  code:
    # Compile with warnings as errors and run all session_distiller unit tests.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: packs/coding-session-trace-distiller/code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile and run every test
        run: make check PYTHON=python

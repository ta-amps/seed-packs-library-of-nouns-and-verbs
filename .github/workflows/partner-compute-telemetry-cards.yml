name: partner-compute-telemetry-cards

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run partner-compute-telemetry-cards unit tests
        working-directory: packs/partner-compute-telemetry-cards/code
        run: |
          make check
          python3 -c "import partner_telemetry"

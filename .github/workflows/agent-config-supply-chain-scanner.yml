# Checks for the agent-config-supply-chain-scanner pack's code, run only when that pack or this workflow changes.
# Standard library only: nothing is installed.
name: agent-config-supply-chain-scanner

on:
  push:
    branches: [main]
    paths:
      - "packs/agent-config-supply-chain-scanner/**"
      - ".github/workflows/agent-config-supply-chain-scanner.yml"
  pull_request:
    paths:
      - "packs/agent-config-supply-chain-scanner/**"
      - ".github/workflows/agent-config-supply-chain-scanner.yml"

permissions:
  contents: read

jobs:
  code:
    # Compile with warnings as errors and run all config_scanner unit tests.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: packs/agent-config-supply-chain-scanner/code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile and run every test
        run: make check PYTHON=python

name: jepa-world-state-and-action-simulator

on:
  push:
    paths:
      - "packs/jepa-world-state-and-action-simulator/**"
      - ".github/workflows/jepa-world-state-and-action-simulator.yml"
  pull_request:
    paths:
      - "packs/jepa-world-state-and-action-simulator/**"
      - ".github/workflows/jepa-world-state-and-action-simulator.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        working-directory: packs/jepa-world-state-and-action-simulator/code
        run: make check

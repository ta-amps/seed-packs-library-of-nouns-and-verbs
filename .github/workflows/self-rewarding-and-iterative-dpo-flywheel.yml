name: self-rewarding-and-iterative-dpo-flywheel

on:
  push:
    paths:
      - "packs/self-rewarding-and-iterative-dpo-flywheel/**"
      - ".github/workflows/self-rewarding-and-iterative-dpo-flywheel.yml"
  pull_request:
    paths:
      - "packs/self-rewarding-and-iterative-dpo-flywheel/**"
      - ".github/workflows/self-rewarding-and-iterative-dpo-flywheel.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run self-rewarding-and-iterative-dpo-flywheel unit tests
        working-directory: packs/self-rewarding-and-iterative-dpo-flywheel/code
        run: |
          make check
          python3 -c "import iterative_rpo_flywheel"

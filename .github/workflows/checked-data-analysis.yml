# Checks for the checked data analysis pack's code, run only when that pack or this workflow changes.
# Standard library only: nothing is installed.
name: checked-data-analysis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code:
    # Compile with warnings as errors, then every test: types, validation rules, fences, queries, chart and trace
    # checks, and the worked example's recomputation.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: packs/checked-data-analysis/code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile and run every test
        run: make check PYTHON=python

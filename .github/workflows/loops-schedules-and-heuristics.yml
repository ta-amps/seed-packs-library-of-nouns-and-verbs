name: loops-schedules-and-heuristics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run loops-schedules-and-heuristics unit tests
        working-directory: packs/loops-schedules-and-heuristics/code
        run: |
          make check
          python3 -c "import loops_schedules"

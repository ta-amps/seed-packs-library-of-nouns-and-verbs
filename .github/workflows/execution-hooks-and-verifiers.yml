name: execution-hooks-and-verifiers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run execution-hooks-and-verifiers unit tests
        working-directory: packs/execution-hooks-and-verifiers/code
        run: |
          make check
          python3 -c "import hooks_verifiers"

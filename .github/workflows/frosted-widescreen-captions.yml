name: frosted-widescreen-captions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run frosted-widescreen-captions unit tests
        working-directory: packs/frosted-widescreen-captions/code
        run: |
          make check
          python3 -c "import frosted_captions"

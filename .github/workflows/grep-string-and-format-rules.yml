name: grep-string-and-format-rules

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run grep-string-and-format-rules unit tests
        working-directory: packs/grep-string-and-format-rules/code
        run: |
          make check
          python3 -c "import rule_engine"

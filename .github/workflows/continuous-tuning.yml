# Checks for the continuous tuning pack's code, run only when that pack or this workflow changes.
# Standard library only: nothing is installed.
name: continuous-tuning

on:
  push:
    branches: [main]
    paths:
      - "packs/continuous-tuning/**"
      - ".github/workflows/continuous-tuning.yml"
  pull_request:
    paths:
      - "packs/continuous-tuning/**"
      - ".github/workflows/continuous-tuning.yml"

permissions:
  contents: read

jobs:
  code:
    # Compile with warnings as errors, then every test: compatibility with the recorded Tessera values and
    # the worked example's recomputation.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: packs/continuous-tuning/code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile and run every test
        run: make check PYTHON=python

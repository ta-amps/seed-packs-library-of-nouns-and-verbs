# Checks for the multimodal-mask-and-transcript-alignment pack's code, run only when that pack or this workflow changes.
# Standard library only: nothing is installed.
name: multimodal-mask-and-transcript-alignment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code:
    # Compile with warnings as errors and run all multimodal_align unit tests.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: packs/multimodal-mask-and-transcript-alignment/code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile and run every test
        run: make check PYTHON=python

# Checks for the LoRA memory and shimming pack's code. Standard library only: nothing is installed.
name: lora-memory-and-shimming

on:
  push:
    branches: [main]
    paths:
      - "packs/lora-memory-and-shimming/**"
      - ".github/workflows/lora-memory-and-shimming.yml"
  pull_request:
    paths:
      - "packs/lora-memory-and-shimming/**"
      - ".github/workflows/lora-memory-and-shimming.yml"

permissions:
  contents: read

jobs:
  code:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: packs/lora-memory-and-shimming/code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile and run every test
        run: make check PYTHON=python

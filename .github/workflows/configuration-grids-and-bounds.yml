name: configuration-grids-and-bounds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run configuration-grids-and-bounds unit tests
        working-directory: packs/configuration-grids-and-bounds/code
        run: |
          make check
          python3 -c "import config_grids"

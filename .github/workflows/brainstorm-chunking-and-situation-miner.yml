# Checks for the brainstorm-chunking-and-situation-miner pack's code, run only when that pack or this workflow changes.
# Standard library only: nothing is installed.
name: brainstorm-chunking-and-situation-miner

on:
  push:
    branches: [main]
    paths:
      - "packs/brainstorm-chunking-and-situation-miner/**"
      - ".github/workflows/brainstorm-chunking-and-situation-miner.yml"
  pull_request:
    paths:
      - "packs/brainstorm-chunking-and-situation-miner/**"
      - ".github/workflows/brainstorm-chunking-and-situation-miner.yml"

permissions:
  contents: read

jobs:
  code:
    # Compile with warnings as errors and run all brainstorm_miner unit tests.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: packs/brainstorm-chunking-and-situation-miner/code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile and run every test
        run: make check PYTHON=python

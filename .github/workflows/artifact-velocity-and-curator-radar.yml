name: artifact-velocity-and-curator-radar

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run artifact-velocity-and-curator-radar unit tests
        working-directory: packs/artifact-velocity-and-curator-radar/code
        run: |
          make check
          python3 -c "import velocity_signal_radar"

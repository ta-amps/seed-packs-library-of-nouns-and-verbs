# Checks for the handwritten statements kit's sample renderer, run only when that pack changes.
name: kit-handwritten-statements

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code:
    # Lint, format check, and a rebuild of every made-up sample page against its pinned pixel digest.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packs/kit-handwritten-statements/code
    env:
      KIT_HANDWRITTEN_REQUIRE_FONTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install the locked environment
        run: make setup
      - name: Lint, format check and the page rebuild (fails instead of skipping without the fonts)
        run: make check

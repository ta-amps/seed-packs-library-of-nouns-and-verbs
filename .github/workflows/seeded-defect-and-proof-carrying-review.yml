name: seeded-defect-and-proof-carrying-review

on:
  push:
    paths:
      - "packs/seeded-defect-and-proof-carrying-review/**"
      - ".github/workflows/seeded-defect-and-proof-carrying-review.yml"
  pull_request:
    paths:
      - "packs/seeded-defect-and-proof-carrying-review/**"
      - ".github/workflows/seeded-defect-and-proof-carrying-review.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run seeded-defect-and-proof-carrying-review unit tests
        working-directory: packs/seeded-defect-and-proof-carrying-review/code
        run: |
          make check
          python3 -c "import proof_carrying_review"

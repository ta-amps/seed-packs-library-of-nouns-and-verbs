name: capability-ontology-and-benchmark-seeds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run capability-ontology-and-benchmark-seeds unit tests
        working-directory: packs/capability-ontology-and-benchmark-seeds/code
        run: |
          make check
          python3 -c "import capability_ontology_seeds"

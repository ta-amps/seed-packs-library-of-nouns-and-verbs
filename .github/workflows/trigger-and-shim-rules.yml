name: trigger-and-shim-rules

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run trigger-and-shim-rules unit tests
        working-directory: packs/trigger-and-shim-rules/code
        run: |
          make check
          python3 -c "import trigger_shim"
